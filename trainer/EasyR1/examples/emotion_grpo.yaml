data:
  # RLHFDataset also supports comma-separated paths (multi-file concat) directly,
  # e.g. ./data/yesbut_full.jsonl,./data/hummus_full.jsonl,./data/metmeme_full.jsonl
  train_files: ./data/emotion_grpo/train.jsonl
  val_files: ./data/emotion_grpo/train.jsonl
  prompt_key: prompt
  answer_key: answer
  image_key: images
  video_key: videos
  # `images` field in the prepared jsonl is already absolute (per-source roots
  # are baked in by examples/prepare_emotion.py), so leave image_dir empty.
  image_dir: null
  video_fps: 2.0
  max_prompt_length: 16384
  max_response_length: 8192
  rollout_batch_size: 2
  mini_rollout_batch_size: null
  val_batch_size: 1
  format_prompt: ./examples/format_prompt/emotion_user.jinja
  system_prompt: ./examples/format_prompt/emotion_system.jinja
  override_chat_template: null
  shuffle: true
  seed: 1
  min_pixels: 4096
  max_pixels: 401408
  filter_overlong_prompts: true

algorithm:
  adv_estimator: grpo
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 0.04
  online_filtering: false
  filter_key: overall
  filter_low: 0.01
  filter_high: 0.99

worker:
  actor:
    global_batch_size: 1
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 1
    max_grad_norm: 5.0
    padding_free: true
    dynamic_batching: true
    ulysses_size: 1
    model:
      model_path: Qwen/Qwen3-VL-8B-Instruct
      enable_gradient_checkpointing: true
      trust_remote_code: false
      freeze_vision_tower: false
      lora:
        rank: 0
        alpha: 64
        target_modules: all-linear
        exclude_modules: .*visual.*
    optim:
      lr: 5.0e-6
      weight_decay: 1.0e-2
      strategy: adamw
      lr_warmup_ratio: 0.0
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
    offload:
      offload_params: true
      offload_optimizer: true

  rollout:
    n: 8
    max_num_batched_tokens: 24576
    temperature: 1.0
    top_p: 1.0
    limit_images: 1
    gpu_memory_utilization: 0.6
    enforce_eager: false
    enable_chunked_prefill: false
    tensor_parallel_size: 2
    disable_tqdm: false
    val_override_config:
      temperature: 0.6
      top_p: 0.95
      n: 1

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: true
      enable_rank0_init: true
    offload:
      offload_params: false

  reward:
    reward_function: ./examples/reward_function/emotion.py:compute_score

trainer:
  total_epochs: 2
  max_steps: null
  project_name: MetaThinker
  experiment_name: qwen3_vl_grpo
  logger: ["file"]
  nnodes: 1
  n_gpus_per_node: 2
  max_try_make_batch: 20
  val_freq: -1
  val_before_train: false
  val_only: false
  val_generations_to_log: 3
  save_freq: 500
  save_limit: 3
  save_model_only: false
  save_checkpoint_path: null
  load_checkpoint_path: null
  find_last_checkpoint: true
