data:
  train_files: ./data/stvg/train.jsonl
  val_files: ./data/stvg/train.jsonl
  prompt_key: prompt
  answer_key: answer
  image_key: images
  video_key: videos
  image_dir: null
  video_dir: null          # set to the root dir containing video files if paths are relative
  video_fps: 1.0           # STVG data is already at 1fps
  max_prompt_length: 64000
  max_response_length: 8192
  rollout_batch_size: 2
  mini_rollout_batch_size: null
  val_batch_size: 1
  format_prompt: null      # prompt already contains full instruction text
  system_prompt: ./examples/format_prompt/stvg_system.jinja
  override_chat_template: null
  # For curriculum learning: set shuffle to false and use train_curriculum.jsonl
  # (generated with `python prepare_stvg.py --curriculum`).
  # For standard training: set shuffle to true and use train.jsonl.
  shuffle: false   # false = respect curriculum order; true = random
  seed: 42
  min_pixels: 4096
  max_pixels: 401408
  filter_overlong_prompts: true

algorithm:
  adv_estimator: grpo
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 0.04
  online_filtering: false
  filter_key: overall
  filter_low: 0.01
  filter_high: 0.99

worker:
  actor:
    global_batch_size: 1
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 1
    max_grad_norm: 5.0
    padding_free: true
    dynamic_batching: true
    ulysses_size: 1
    model:
      model_path: Qwen/Qwen3-VL-8B-Instruct   # replace with your local path
      enable_gradient_checkpointing: true
      trust_remote_code: false
      freeze_vision_tower: false
      lora:
        rank: 0
        alpha: 64
        target_modules: all-linear
        exclude_modules: .*visual.*
    optim:
      lr: 5.0e-6
      weight_decay: 1.0e-2
      strategy: adamw
      lr_warmup_ratio: 0.0
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
    offload:
      offload_params: true
      offload_optimizer: true

  rollout:
    n: 8
    max_num_batched_tokens: 24576
    temperature: 1.0
    top_p: 1.0
    limit_images: 0
    gpu_memory_utilization: 0.6
    enforce_eager: false
    enable_chunked_prefill: false
    tensor_parallel_size: 2
    disable_tqdm: false
    val_override_config:
      temperature: 0.6
      top_p: 0.95
      n: 1

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: true
      enable_rank0_init: true
    offload:
      offload_params: false

  reward:
    reward_function: ./examples/reward_function/stvg.py:compute_score

trainer:
  total_epochs: 1
  max_steps: null
  project_name: CompSTVG
  experiment_name: stvg_grpo
  logger: ["file"]
  nnodes: 1
  n_gpus_per_node: 8
  max_try_make_batch: 20
  val_freq: -1
  val_before_train: false
  val_only: false
  val_generations_to_log: 3
  save_freq: 500
  save_limit: 3
  save_model_only: false
  save_checkpoint_path: null
  load_checkpoint_path: null
  find_last_checkpoint: true
